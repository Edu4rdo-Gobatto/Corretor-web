name: Testes do frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run visual:build
      - run: node scripts/seo-smoke.mjs
      - run: npm run visual:sem-build
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorio-playwright-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 14
